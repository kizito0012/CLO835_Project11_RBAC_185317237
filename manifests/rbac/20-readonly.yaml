apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly-role-sidplaceholder
  namespace: rbac-sidplaceholder
  labels:
    owner: "sidplaceholder"
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding-sidplaceholder
  namespace: rbac-sidplaceholder
  labels:
    owner: "sidplaceholder"
subjects:
  - kind: ServiceAccount
    name: readonly-sidplaceholder
    namespace: rbac-sidplaceholder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: readonly-role-sidplaceholder
